name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir dist
          cd skills
          for skill in */; do
            zip -qrX "../dist/${skill%/}.zip" "$skill" -x '*.DS_Store'
          done
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
